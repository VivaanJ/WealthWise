name: Build UML design PDF

on:
  push:
    branches: [main]
    paths:
      - "tools/generate_uml_pdf.py"
      - ".github/workflows/build-uml-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-uml:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF generator
        run: python -m pip install reportlab
      - name: Generate UML design document
        run: python tools/generate_uml_pdf.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WealthWise_UML_Design_Document.pdf
          if git diff --cached --quiet; then
            echo "UML PDF is already up to date."
          else
            git commit -m "Generate WealthWise UML design document"
            git push
          fi
